<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; } body { margin: 0; width: 1200px; height: 675px; display: grid; grid-template-columns: 360px 1fr; color: #19211e; background: #f8f8f5; font-family: system-ui, sans-serif; }
    aside { padding: 46px 34px; background: #1d2924; color: white; } .kicker { color: #f3c95d; font-size: 14px; font-weight: 800; }
    h1 { margin: 16px 0 24px; font: 700 38px/1.12 Georgia, serif; } aside p { color: #c5d2cc; line-height: 1.7; }
    .trigger { margin-top: 28px; padding: 14px; border: 1px solid #6f887d; color: #98e2c7; font-family: monospace; }
    main { padding: 44px; } h2 { margin: 0 0 20px; font: 700 27px Georgia, serif; }
    ol { list-style: none; margin: 0; padding: 0; } li { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 68px; border-bottom: 1px solid #cdd6d0; }
    li span { color: #d5523f; font: 700 20px Georgia, serif; } li strong { font-size: 17px; } li small { color: #64706a; }
    footer { margin-top: 24px; padding: 16px; display: flex; gap: 12px; background: #edf5f1; color: #07554f; font-weight: 700; }
  </style>
</head>
<body>
  <aside><div class="kicker">ANONYMIZED SKILL</div><h1>Manuscript Writing Review</h1><p>把反覆出現的寫作審查準則封裝成可測試流程；不取代方法、統計或學術內容判斷。</p><div class="trigger">trigger: review my writing</div></aside>
  <main><h2>審查工作流</h2><ol><li><span>01</span><strong>辨識讀者、章節與投稿目的</strong><small>CONTEXT</small></li><li><span>02</span><strong>檢查主張強度與證據距離</strong><small>CLAIMS</small></li><li><span>03</span><strong>標記術語漂移與未定義符號</strong><small>CONSISTENCY</small></li><li><span>04</span><strong>提出可直接採用的局部改寫</strong><small>REVISION</small></li><li><span>05</span><strong>用第二份匿名樣本做盲測</strong><small>EVALUATION</small></li></ol><footer>✓ 原文與建議分離　✓ 技術問題另列　✓ 作者保留最終判斷</footer></main>
</body>
</html>
