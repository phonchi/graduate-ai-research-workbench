<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; } body { margin: 0; width: 1200px; height: 675px; padding: 44px; background: #f2f5f1; color: #18201d; font-family: system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: end; padding-bottom: 22px; border-bottom: 2px solid #18201d; }
    h1 { margin: 0; font: 700 42px Georgia, serif; } .tag { color: #006f67; font-weight: 700; }
    main { display: grid; grid-template-columns: 1.25fr .75fr; gap: 26px; margin-top: 26px; }
    section { background: white; border: 1px solid #b8c5bd; } h2 { margin: 0; padding: 15px 20px; color: white; background: #07554f; font-size: 18px; }
    .file { display: grid; grid-template-columns: 1fr 92px 80px; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #d8dfda; font-size: 15px; }
    .file:last-child { border-bottom: 0; } .muted { color: #66716c; } .metric { padding: 24px; border-bottom: 1px solid #d8dfda; }
    .metric strong { display: block; color: #d5523f; font: 700 40px Georgia, serif; } .flow { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .flow span { padding: 9px 12px; border: 1px solid #95aaa1; background: white; } .flow b { color: #d5523f; }
  </style>
</head>
<body>
  <header><div><div class="tag">DOCUMENT CACHE / SYNTHETIC CORPUS</div><h1>可回查的研究文件索引</h1></div><div>2026-07-10</div></header>
  <main>
    <section><h2>來源與正規化結果</h2><div class="file"><strong>paper-01-method.pdf</strong><span class="muted">PDF</span><span>12,842 字</span></div><div class="file"><strong>paper-02-baseline.docx</strong><span class="muted">DOCX</span><span>8,104 字</span></div><div class="file"><strong>notes-assumptions.md</strong><span class="muted">MD</span><span>3,291 字</span></div><div class="file"><strong>dataset-card.html</strong><span class="muted">HTML</span><span>4,609 字</span></div><div class="file"><strong>index.json</strong><span class="muted">INDEX</span><span>4 records</span></div></section>
    <section><h2>索引健康度</h2><div class="metric"><strong>4 / 4</strong><span>來源保留檔名與類型</span></div><div class="metric"><strong>100%</strong><span>可由摘要回到來源紀錄</span></div><div class="metric"><strong>0</strong><span>未標示來源的片段</span></div></section>
  </main>
  <div class="flow"><span>授權文件</span><b>→</b><span>文字正規化</span><b>→</b><span>結構化索引</span><b>→</b><span>問答後回查原文</span></div>
</body>
</html>
