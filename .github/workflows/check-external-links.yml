name: Check external links

on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published references
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --exclude 'http://127.0.0.1'
            'src/**/*.md'
            'src/**/*.astro'
            'README.md'
          fail: true
